<text x="752.7" y="114.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">128 samples</text>
<rect x="826.0" y="80.0" width="10.3" height="50.0" rx="0" fill="#FDF0DC" stroke="#B45309" stroke-width="1"/>
<rect x="836.4" y="80.0" width="146.7" height="50.0" rx="0" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1"/>
