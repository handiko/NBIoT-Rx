<text x="909.7" y="114.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">128 samples</text>
<rect x="983.0" y="80.0" width="10.3" height="50.0" rx="0" fill="#FDF0DC" stroke="#B45309" stroke-width="1"/>
<rect x="993.3" y="80.0" width="146.7" height="50.0" rx="0" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1"/>
<text x="1066.7" y="98.0" font-size="11" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">symbol 6</text>
<text x="1066.7" y="114.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">128 samples</text>
<text x="45.7" y="146.0" font-size="10" fill="#B45309" font-weight="600" text-anchor="middle" dominant-baseline="central">CP 10</text>
<text x="203.3" y="146.0" font-size="10" fill="#B45309" font-weight="600" text-anchor="middle" dominant-baseline="central">CP 9</text>
<text x="1140.0" y="146.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="end" dominant-baseline="central">symbol 0 has a 10-sample cyclic prefix, symbols 1–6 have 9: 10 + 6×9 + 7×128 = 960</text>
<text x="40.0" y="210.0" font-size="12" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">Cyclic prefix: the end of each symbol is copied in front of it</text>
<rect x="60.0" y="230.0" width="70.0" height="56.0" rx="0" fill="#FDF0DC" stroke="#B45309" stroke-width="1.2"/>
<rect x="130.0" y="230.0" width="500.0" height="56.0" rx="0" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.2"/>
<rect x="560.0" y="230.0" width="70.0" height="56.0" rx="0" fill="#FDF0DC" stroke="#B45309" stroke-width="1.0" stroke-dasharray="4 3" fill-opacity="0.7"/>
<text x="95.0" y="258.0" font-size="11" fill="#B45309" font-weight="700" text-anchor="middle" dominant-baseline="central">copy</text>
<text x="380.0" y="258.0" font-size="11" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">128 samples = 66.7 µs = exactly one cycle of 15 kHz</text>
<path d="M595 286 C 560 326, 140 326, 95 286" fill="none" stroke="#B45309" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#aha)"/>
<text x="660.0" y="234.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Why: echoes off buildings arrive a few µs late. The 4.7–5.2 µs prefix</text>
<text x="660.0" y="248.8" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">swallows them, so the FFT window (128 samples) sees one clean symbol.</text>
<text x="660.0" y="263.7" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">My sync block cuts each window 2 samples into the prefix, for margin.</text>
<text x="40.0" y="390.0" font-size="12" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">In the receiver: 128-point FFT per symbol → 128 bins, 15 kHz apart; the 12 in the middle are NB-IoT</text>
