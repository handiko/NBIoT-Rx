<text x="584.0" y="518.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">bins 59 … 70 after the FFT shift (64 bins shown of 128)</text>
<text x="482.0" y="420.0" font-size="11" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">Keep M in N (12 of 128, offset 59)</text>
<text x="760.0" y="488.0" font-size="12" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">Each resource element carries one QPSK symbol = 2 bits</text>
<line x1="810.0" y1="600.0" x2="990.0" y2="600.0" stroke="#6b6b66" stroke-width="1.0"/>
<line x1="900.0" y1="520.0" x2="900.0" y2="680.0" stroke="#6b6b66" stroke-width="1.0"/>
<circle cx="950.0" cy="550.0" r="7.0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="964.0" y="536.0" font-size="11" fill="#1d4ed8" font-weight="700" text-anchor="start" dominant-baseline="central">00</text>
<circle cx="850.0" cy="550.0" r="7.0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="836.0" y="536.0" font-size="11" fill="#1d4ed8" font-weight="700" text-anchor="end" dominant-baseline="central">10</text>
<circle cx="950.0" cy="650.0" r="7.0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="964.0" y="636.0" font-size="11" fill="#1d4ed8" font-weight="700" text-anchor="start" dominant-baseline="central">01</text>
<circle cx="850.0" cy="650.0" r="7.0" fill="#1d4ed8" stroke="none" stroke-width="1"/>
<text x="836.0" y="636.0" font-size="11" fill="#1d4ed8" font-weight="700" text-anchor="end" dominant-baseline="central">11</text>
<text x="995.0" y="604.0" font-size="11" fill="#6b6b66" font-weight="600" text-anchor="start" dominant-baseline="central">I</text>
<text x="906.0" y="512.0" font-size="11" fill="#6b6b66" font-weight="600" text-anchor="start" dominant-baseline="central">Q</text>
<text x="40.0" y="556.0" font-size="11.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">A subframe has 14 symbols × 12 subcarriers = 168 resource elements (REs).</text>
<text x="40.0" y="571.5" font-size="11.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Each RE is one complex number: amplitude and phase.</text>
<text x="40.0" y="587.0" font-size="11.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">For data, the transmitter picks one of four phases: first bit → sign of I, second bit → sign of Q.</text>
<text x="40.0" y="602.6" font-size="11.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">That is QPSK. NB-IoT uses nothing denser in the downlink: robust beats fast.</text>
<text x="40.0" y="618.1" font-size="11.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">After my equaliser, those four points are the four clusters in the constellation plots.</text>
</svg>
