<text x="330.0" y="611.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">is a sync line there?</text>
<rect x="990.0" y="390.0" width="160.0" height="74.0" rx="8" fill="#EDE7FB" stroke="#6D28D9" stroke-width="1.3"/>
