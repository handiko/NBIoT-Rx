<text x="276.0" y="500.0" font-size="10" fill="#A32D2D" font-weight="600" text-anchor="start" dominant-baseline="central">messages</text>
<rect x="530.0" y="368.0" width="180.0" height="44.0" rx="8" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.3"/>
<text x="620.0" y="382.0" font-size="12" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">Resource grid raster</text>
<text x="620.0" y="399.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">|X|² in dB</text>
<path d="M295.0 304.0 L295.0 330.0 L620.0 330.0 L620.0 366.0" fill="none" stroke="#6b6b66" stroke-width="1.4" marker-end="url(#ahm)"/>
<rect x="410.0" y="560.0" width="150.0" height="70.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="485.0" y="587.0" font-size="13" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">Keep 1 in 8</text>
<text x="485.0" y="604.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">→ 240 kS/s</text>
<rect x="590.0" y="560.0" width="170.0" height="70.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="675.0" y="579.5" font-size="13" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">FFT Filter</text>
<text x="675.0" y="596.5" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">NPSS matched taps</text>
<text x="675.0" y="611.5" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">(the correlator)</text>
<rect x="790.0" y="560.0" width="170.0" height="70.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="875.0" y="579.5" font-size="12" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">|corr|² ÷ energy</text>
<text x="875.0" y="596.5" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">Complex to Mag², Moving</text>
<text x="875.0" y="611.5" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">Average, Divide</text>
<rect x="990.0" y="560.0" width="160.0" height="70.0" rx="8" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.3"/>
<text x="1070.0" y="587.0" font-size="12" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">Time Raster</text>
<text x="1070.0" y="604.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">NPSS, 10 ms per row</text>
