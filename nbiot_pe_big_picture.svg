<text x="1070.0" y="430.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">'nbiot': the maths</text>
<text x="1070.0" y="445.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">both EPBs call into it</text>
