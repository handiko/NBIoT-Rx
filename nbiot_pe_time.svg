<text x="30.0" y="480.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">The frame number SFN (0–1023) is what the MIB-NB carries (its top 4 bits; the rest comes from where in the 640 ms broadcast cycle it is read).</text>
<text x="30.0" y="494.9" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">The hyperframe number H-SFN is split: 2 low bits in the MIB-NB, 8 high bits in SIB1-NB ("hyperSFN-MSB"). Together they count to 1024.</text>
<text x="30.0" y="509.7" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Devices that sleep for hours (eDRX, power-saving mode) need H-SFN to wake up on the right frame. A smart meter can sleep for most of 2.9 hours.</text>
