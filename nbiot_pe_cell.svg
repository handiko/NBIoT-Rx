<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="What cell 260 told me">
<title>What cell 260 told me</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d3d3a"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="24.0" font-size="15" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">What cell 260 told me, in plain words</text>
<rect x="30.0" y="60.0" width="550.0" height="205.0" rx="10" fill="#E6ECFB" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="48.0" y="86.0" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="start" dominant-baseline="central">Who it is</text>
<text x="48.0" y="120.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Telkomsel: MCC 510 (Indonesia), MNC 10</text>
<text x="48.0" y="148.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">PCI 260 (radio name tag, from the NSSS)</text>
<text x="48.0" y="176.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">cellIdentity 0x21827DE = eNodeB 137255, cell 222</text>
<text x="48.0" y="204.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">tracking area 0x56B9 = 22201</text>
<text x="48.0" y="232.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">not barred, not reserved: open for devices</text>
<rect x="600.0" y="60.0" width="550.0" height="205.0" rx="10" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="618.0" y="86.0" font-size="14" fill="#0F6E56" font-weight="700" text-anchor="start" dominant-baseline="central">Where it lives</text>
<text x="618.0" y="120.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Band 8, 935.4 MHz, standalone carrier</text>
<text x="618.0" y="148.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">(in old GSM spectrum, not inside LTE)</text>
<text x="618.0" y="176.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">1 transmit antenna port</text>
<text x="618.0" y="204.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">NRS power 32 dBm per subcarrier</text>
<text x="618.0" y="232.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">→ about 43 dBm (20 W) for all 12</text>
<rect x="30.0" y="285.0" width="550.0" height="205.0" rx="10" fill="#FDF0DC" stroke="#B45309" stroke-width="1.3"/>
<text x="48.0" y="311.0" font-size="14" fill="#B45309" font-weight="700" text-anchor="start" dominant-baseline="central">Who may camp here</text>
<text x="48.0" y="345.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">RSRP at least −128 dBm (q-RxLevMin −64 × 2)</text>
<text x="48.0" y="373.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">RSRQ at least −23 dB (q-QualMin)</text>
<text x="48.0" y="401.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">coverage levels by RSRP: &gt; −110, −110…−120, &lt; −120 dBm</text>
<text x="48.0" y="429.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">random access repeated 2 / 8 / 32 times</text>
<text x="48.0" y="457.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">access barring off (ab-Enabled = False)</text>
<rect x="600.0" y="285.0" width="550.0" height="205.0" rx="10" fill="#EDE7FB" stroke="#6D28D9" stroke-width="1.3"/>
<text x="618.0" y="311.0" font-size="14" fill="#6D28D9" font-weight="700" text-anchor="start" dominant-baseline="central">How it pages a sleeping meter</text>
<text x="618.0" y="345.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">paging cycle 2.56 s (rf256)</text>
<text x="618.0" y="373.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">nB = T/64: 4 paging frames per cycle</text>
<text x="618.0" y="401.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">paging control repeated up to 128 times</text>
<text x="618.0" y="429.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">SIB edits announced 81.92 s ahead (32 cycles)</text>
<text x="618.0" y="457.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">timing advance never expires (infinity)</text>
<rect x="30.0" y="510.0" width="550.0" height="205.0" rx="10" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.3"/>
<text x="48.0" y="536.0" font-size="14" fill="#A32D2D" font-weight="700" text-anchor="start" dominant-baseline="central">How a device talks back</text>
<text x="48.0" y="570.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">NPRACH every 640 ms, 12 tones of 3.75 kHz</text>
<text x="48.0" y="598.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">first try aimed to arrive at −112 dBm, +2 dB per retry</text>
<text x="48.0" y="626.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">NPUSCH power: P0 −100 dBm, full path-loss compensation</text>
<text x="48.0" y="654.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Msg4 ACK repeated 2 / 8 / 64 times</text>
<text x="48.0" y="682.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">T300 = 60 s to finish connecting (LTE: ~1 s)</text>
<rect x="600.0" y="510.0" width="550.0" height="205.0" rx="10" fill="#E0F2F7" stroke="#0e7490" stroke-width="1.3"/>
<text x="618.0" y="536.0" font-size="14" fill="#0e7490" font-weight="700" text-anchor="start" dominant-baseline="central">When to look for another cell</text>
<text x="618.0" y="570.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">SIB3: search neighbours if RSRP &lt; −70 dBm (58 dB above min)</text>
<text x="618.0" y="598.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">hysteresis 4 dB, wait 3 s before moving</text>
<text x="618.0" y="626.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">no other frequency listed: all on 935.4 MHz</text>
<text x="618.0" y="654.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">(that is frequency reuse 1, seen from the inside)</text>
<text x="618.0" y="682.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">SI message every 5.12 s, window 960 ms</text>
<text x="30.0" y="742.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">Sources: MIB-NB, SIB1-NB, SIB2-NB and SIB3-NB decoded by my flowgraph; meanings from 3GPP TS 36.331 / 36.304 / 36.213.</text>
</svg>
